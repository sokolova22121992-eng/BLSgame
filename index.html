
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLS — День перезапуску серця</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #b9d8ed;
}

#world {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#hud {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 18px;
  pointer-events: none;
}

#top-label {
  position: absolute;
  top: 18px;
  left: 18px;
  padding: 10px 15px;
  border-radius: 12px;
  color: white;
  background: rgba(17, 39, 63, .88);
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
}

#panel {
  pointer-events: auto;
  width: min(720px, 100%);
  margin: 0 auto;
  padding: 20px;
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 20px;
  background: rgba(255,255,255,.96);
  box-shadow: 0 12px 40px rgba(14,35,58,.22);
}

#stage-label {
  color: #d12b37;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

h1 {
  margin: 0 0 10px;
  font-size: clamp(21px, 4vw, 29px);
  color: #17283c;
}

#description {
  color: #435368;
  font-size: 15px;
  line-height: 1.5;
  margin-bottom: 15px;
}

#answers {
  display: grid;
  gap: 9px;
}

.answer {
  display: block;
  width: 100%;
  padding: 13px 15px;
  border: 2px solid #dce4ec;
  border-radius: 12px;
  background: #fff;
  color: #1d3045;
  text-align: left;
  font-size: 15px;
  line-height: 1.4;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}

.answer:hover:not(:disabled) {
  border-color: #357fc0;
  background: #f0f7ff;
}

.answer:disabled { cursor: default; }

.answer.correct {
  background: #d9f5e4;
  border-color: #239653;
  color: #155c35;
}

.answer.wrong {
  background: #ffeadb;
  border-color: #e27a36;
  color: #803b13;
}

#feedback {
  display: none;
  margin-top: 13px;
  padding: 13px 14px;
  border-radius: 11px;
  background: #edf4fa;
  color: #263e55;
  font-size: 14px;
  line-height: 1.5;
}

#next {
  display: none;
  width: 100%;
  margin-top: 13px;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  background: #c92735;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#next:hover { background: #a91e2a; }

#progress {
  display: flex;
  gap: 5px;
  margin-top: 15px;
}

.progress-part {
  height: 5px;
  flex: 1;
  border-radius: 5px;
  background: #dfe6ed;
}

.progress-part.done { background: #c92735; }

@media (max-height: 700px) {
  #hud { padding: 10px; }
  #panel { padding: 14px; max-height: 72vh; overflow-y: auto; }
  #description { margin-bottom: 10px; }
  .answer { padding: 10px 12px; }
  #top-label { top: 10px; left: 10px; }
}

@media (max-width: 480px) {
  #hud { padding: 9px; }
  #panel { padding: 14px; border-radius: 16px; }
  #description, .answer { font-size: 14px; }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
</head>

<body>
<div id="world"></div>

<div id="hud">
  <div id="top-label">ЕМД · BLS TRAINING</div>

  <section id="panel">
    <div id="stage-label">Інтерактивний сценарій</div>
    <h1 id="title">Чи зможеш ти врятувати життя?</h1>
    <div id="description">
      Перед тобою людина, якій раптово стало зле. Твої дії можуть змінити результат.
    </div>

    <div id="answers"></div>
    <div id="feedback"></div>
    <button id="next">Почати сценарій →</button>

    <div id="progress">
      <div class="progress-part"></div>
      <div class="progress-part"></div>
      <div class="progress-part"></div>
      <div class="progress-part"></div>
    </div>
  </section>
</div>

<script type="module">
import * as THREE from 'three';

const world = document.getElementById('world');
const titleEl = document.getElementById('title');
const descriptionEl = document.getElementById('description');
const stageLabel = document.getElementById('stage-label');
const answersEl = document.getElementById('answers');
const feedbackEl = document.getElementById('feedback');
const nextButton = document.getElementById('next');
const progressParts = [...document.querySelectorAll('.progress-part')];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9d8ed);
scene.fog = new THREE.Fog(0xb9d8ed, 14, 35);

const camera = new THREE.PerspectiveCamera(
  38, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.set(4.8, 4.1, 9.5);
camera.lookAt(0, 1.0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
world.appendChild(renderer.domElement);

// Освітлення
scene.add(new THREE.HemisphereLight(0xffffff, 0x73869b, 2.1));

const sunlight = new THREE.DirectionalLight(0xffffff, 3.0);
sunlight.position.set(-4, 8, 6);
sunlight.castShadow = true;
sunlight.shadow.mapSize.set(1024, 1024);
scene.add(sunlight);

// Матеріали
function mat(color, roughness = 0.8, metalness = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}

const materials = {
  red: mat(0xc92735),
  darkRed: mat(0x991d2a),
  navy: mat(0x202d40),
  black: mat(0x171b22),
  skin: mat(0xd7a17e),
  hair: mat(0x38271f),
  reflective: mat(0xf6e5a2, 0.35),
  white: mat(0xf4f5f6),
  blue: mat(0x2166a5),
  glass: mat(0x8bbbd2, 0.3),
  rubber: mat(0x252a30),
  ground: mat(0x8baf93)
};

function addBox(parent, w, h, d, material, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d), material
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function addSphere(parent, r, material, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(r, 20, 16), material
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

function addLimb(parent, a, b, radius, material, radiusEnd = radius * 0.9) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = new THREE.Vector3().subVectors(end, start);

  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radiusEnd, radius, direction.length(), 12),
    material
  );
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0), direction.clone().normalize()
  );
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

// Земля
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  materials.ground
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.025;
ground.receiveShadow = true;
scene.add(ground);

// Позначена зона роботи
const workZone = new THREE.Mesh(
  new THREE.PlaneGeometry(5.5, 4.5),
  mat(0xa6c8aa)
);
workZone.rotation.x = -Math.PI / 2;
workZone.position.set(0, 0.002, 0);
scene.add(workZone);

// Декоративні лінії на землі
for (let i = -2; i <= 2; i++) {
  const line = new THREE.Mesh(
    new THREE.BoxGeometry(0.025, 0.008, 4.2),
    mat(0xd9e7d9)
  );
  line.position.set(i * 0.8, 0.01, 0);
  scene.add(line);
}

// Персонаж ЕМД — повністю створений кодом
const character = new THREE.Group();
character.position.set(-1.55, 0, 0.15);
scene.add(character);

const body = new THREE.Group();
character.add(body);

const headGroup = new THREE.Group();
body.add(headGroup);

const leftArm = new THREE.Group();
leftArm.position.set(-0.34, 1.48, 0);
body.add(leftArm);

const rightArm = new THREE.Group();
rightArm.position.set(0.34, 1.48, 0);
body.add(rightArm);

function makeParamedic() {
  // Штани
  addBox(body, 0.19, 0.72, 0.25, materials.navy, -0.13, 0.49, 0);
  addBox(body, 0.19, 0.72, 0.25, materials.navy,  0.13, 0.49, 0);

  // Світловідбивні смуги на штанах
  addBox(body, 0.198, 0.045, 0.26, materials.reflective, -0.13, 0.36, 0);
  addBox(body, 0.198, 0.045, 0.26, materials.reflective,  0.13, 0.36, 0);

  // Черевики
  addBox(body, 0.23, 0.13, 0.34, materials.black, -0.13, 0.09, 0.045);
  addBox(body, 0.23, 0.13, 0.34, materials.black,  0.13, 0.09, 0.045);

  // Куртка
  addBox(body, 0.62, 0.67, 0.31, materials.red, 0, 1.22, 0);
  addBox(body, 0.24, 0.12, 0.33, materials.darkRed, 0, 1.57, 0);

  // Застібка
  addBox(body, 0.035, 0.48, 0.02, materials.darkRed, 0, 1.23, 0.166);

  // Світловідбивні смуги куртки
  addBox(body, 0.625, 0.055, 0.322, materials.reflective, 0, 1.04, 0);
  addBox(body, 0.625, 0.055, 0.322, materials.reflective, 0, 1.43, 0);

  // Нагрудна емблема з медичним хрестом
  addBox(body, 0.13, 0.13, 0.018, materials.white, -0.17, 1.32, 0.17);
  addBox(body, 0.085, 0.025, 0.023, materials.red, -0.17, 1.32, 0.183);
  addBox(body, 0.025, 0.085, 0.023, materials.red, -0.17, 1.32, 0.183);

  // Шия
  addLimb(body, [0, 1.53, 0], [0, 1.66, 0], 0.09, materials.skin);

  // Голова та волосся
  addSphere(headGroup, 0.19, materials.skin, 0, 1.79, 0);
  addSphere(headGroup, 0.192, materials.hair, 0, 1.88, -0.025);

  // Обличчя спереду
  addSphere(headGroup, 0.018, materials.black, -0.065, 1.81, 0.174);
  addSphere(headGroup, 0.018, materials.black,  0.065, 1.81, 0.174);
  addSphere(headGroup, 0.035, materials.skin, -0.19, 1.79, 0);
  addSphere(headGroup, 0.035, materials.skin,  0.19, 1.79, 0);

  // Ліва рука: плече, передпліччя, кисть.
  // Руки опущені й трохи зігнуті, а не розведені в сторони.
  addLimb(leftArm, [0, 0, 0], [-0.08, -0.27, 0.015], 0.105, materials.red);
  addLimb(leftArm, [-0.08, -0.27, 0.015], [-0.05, -0.55, 0.06], 0.083, materials.red);
  addSphere(leftArm, 0.075, materials.skin, -0.05, -0.60, 0.065);

  // Права рука
  addLimb(rightArm, [0, 0, 0], [0.08, -0.27, 0.015], 0.105, materials.red);
  addLimb(rightArm, [0.08, -0.27, 0.015], [0.05, -0.55, 0.06], 0.083, materials.red);
  addSphere(rightArm, 0.075, materials.skin, 0.05, -0.60, 0.065);

  // Рукавні світловідбивні смуги
  addLimb(leftArm, [-0.035, -0.18, 0.012], [-0.05, -0.23, 0.018], 0.097, materials.reflective);
  addLimb(rightArm, [0.035, -0.18, 0.012], [0.05, -0.23, 0.018], 0.097, materials.reflective);
}

makeParamedic();

// Автомобіль ЕМД
const ambulance = new THREE.Group();
ambulance.position.set(2.65, 0, -1.65);
scene.add(ambulance);

function makeAmbulance() {
  // Основний кузов
  addBox(ambulance, 1.9, 1.15, 3.1, materials.white, 0, 0.86, 0);

  // Кабіна спереду
  addBox(ambulance, 1.8, 0.85, 1.05, materials.white, 0, 1.15, 1.35);
  addBox(ambulance, 1.52, 0.43, 0.035, materials.glass, 0, 1.38, 1.89);

  // Бокові вікна
  addBox(ambulance, 0.035, 0.43, 0.65, materials.glass, 0.96, 1.33, 0.45);
  addBox(ambulance, 0.035, 0.43, 0.65, materials.glass, 0.96, 1.33, -0.42);

  // Червона смуга
  addBox(ambulance, 1.92, 0.15, 3.12, materials.red, 0, 0.72, 0);

  // Синій знак на борту
  addBox(ambulance, 0.035, 0.44, 0.34, materials.blue, 0.972, 1.18, -0.9);

  // Колеса
  for (const z of [-1.0, 1.15]) {
    for (const x of [-0.93, 0.93]) {
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.29, 0.29, 0.16, 20),
        materials.rubber
      );
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(x, 0.3, z);
      wheel.castShadow = true;
      ambulance.add(wheel);
    }
  }

  // Світлова панель на даху
  addBox(ambulance, 0.8, 0.12, 0.2, materials.blue, 0, 1.77, 0.9);
  addBox(ambulance, 0.45, 0.1, 0.2, materials.red, 0, 1.77, 0.9);
}

makeAmbulance();

// Манекен / постраждалий лежачи
const patient = new THREE.Group();
patient.position.set(0.75, 0, 0.6);
scene.add(patient);

function makePatient() {
  const shirt = mat(0x376d9a);
  const trousers = mat(0x303b4b);

  // Тулуб
  addBox(patient, 0.48, 0.22, 0.78, shirt, 0, 0.22, 0);

  // Голова
  addSphere(patient, 0.16, materials.skin, 0, 0.28, 0.52);

  // Ноги
  addBox(patient, 0.19, 0.17, 0.63, trousers, -0.14, 0.16, -0.62);
  addBox(patient, 0.19, 0.17, 0.63, trousers,  0.14, 0.16, -0.62);

  // Руки вздовж тулуба
  addLimb(patient, [-0.23, 0.23, 0.28], [-0.37, 0.13, -0.1], 0.07, shirt);
  addLimb(patient, [ 0.23, 0.23, 0.28], [ 0.37, 0.13, -0.1], 0.07, shirt);

  // Кисті
  addSphere(patient, 0.06, materials.skin, -0.37, 0.13, -0.12);
  addSphere(patient, 0.06, materials.skin,  0.37, 0.13, -0.12);
}

makePatient();

// Автоматичний зовнішній дефібрилятор
const aed = new THREE.Group();
aed.position.set(1.75, 0, 1.0);
scene.add(aed);

function makeAED() {
  addBox(aed, 0.42, 0.26, 0.32, materials.yellow || mat(0xf2c94c), 0, 0.16, 0);
  addBox(aed, 0.26, 0.08, 0.025, materials.white, 0, 0.19, 0.17);
  addBox(aed, 0.055, 0.055, 0.03, materials.red, 0, 0.19, 0.19);

  const cableMat = mat(0x303030);
  addLimb(aed, [-0.13, 0.13, -0.1], [-0.28, 0.06, -0.24], 0.018, cableMat);
  addBox(aed, 0.12, 0.025, 0.08, materials.white, -0.29, 0.035, -0.26);
  addBox(aed, 0.12, 0.025, 0.08, materials.white, 0.29, 0.035, -0.26);
}

makeAED();

// Сценарій BLS
const stages = [
  {
    label: 'Сценарій',
    title: 'Чи зможеш ти врятувати життя?',
    description: 'Перед тобою людина, яка раптово знепритомніла. Ти поруч. Кожна дія має значення.',
    answers: [],
    feedback: '',
    correct: -1
  },
  {
    label: 'Крок 1 · Оцінка ситуації',
    title: 'Людина не реагує. Що робиш?',
    description: 'Ти підійшов до постраждалого. Переконайся, що місце безпечне.',
    answers: [
      'Перевіряю реакцію, кличу на допомогу, телефоную 103/112 на гучному зв’язку та оцінюю дихання.',
      'Одразу починаю робити штучне дихання.',
      'Залишаю людину й шукаю її документи.'
    ],
    correct: 0,
    feedback: 'Правильно: безпека, перевірка реакції, виклик екстреної допомоги та оцінка дихання. Не затягуй із наступним кроком.'
  },
  {
    label: 'Крок 2 · Дихання',
    title: 'Людина не реагує та лише хапає повітря. Що це означає?',
    description: 'Рідкісні судомні вдихи або хапання повітря не є нормальним диханням.',
    answers: [
      'Це нормально. Чекаю, поки людина прийде до тями.',
      'Підозрюю зупинку кровообігу та негайно починаю СЛР.',
      'Спочатку довго шукаю пульс.'
    ],
    correct: 1,
    feedback: 'Правильно: непритомність у поєднанні з відсутнім або ненормальним диханням — підстава підозрювати зупинку кровообігу та почати СЛР.'
  },
  {
    label: 'Крок 3 · СЛР',
    title: 'Яка правильна частота натискань на грудну клітку дорослого?',
    description: 'Ти починаєш серцево-легеневу реанімацію.',
    answers: [
      '60–80 натискань за хвилину.',
      '100–120 натискань за хвилину, глибина 5–6 см, із повним розправленням грудної клітки.',
      '140–160 натискань за хвилину.'
    ],
    correct: 1,
    feedback: 'Правильно: 100–120/хв, глибина 5–6 см у дорослого, повне розправлення грудної клітки та мінімальні перерви. Попроси принести AED і застосуй його якомога швидше.'
  },
  {
    label: 'Сценарій завершено',
    title: 'Твої дії можуть врятувати життя.',
    description: 'Розпізнай зупинку кровообігу, виклич допомогу, почни СЛР і використай AED якомога швидше.',
    answers: [],
    feedback: '',
    correct: -1
  }
];

let currentStage = 0;
let answered = false;

function updateProgress() {
  progressParts.forEach((part, i) => {
    part.classList.toggle('done', i < Math.min(currentStage, 4));
  });
}

function showStage(index) {
  currentStage = index;
  answered = false;

  const stage = stages[index];

  stageLabel.textContent = stage.label;
  titleEl.textContent = stage.title;
  descriptionEl.textContent = stage.description;

  answersEl.innerHTML = '';
  feedbackEl.style.display = 'none';
  feedbackEl.textContent = '';
  nextButton.style.display = 'none';

  if (index === 0) {
    nextButton.textContent = 'Почати сценарій →';
    nextButton.style.display = 'block';
  } else if (index === stages.length - 1) {
    nextButton.textContent = 'Пройти ще раз ↻';
    nextButton.style.display = 'block';
  } else {
    nextButton.textContent = 'Наступний крок →';

    stage.answers.forEach((answer, answerIndex) => {
      const button = document.createElement('button');
      button.className = 'answer';
      button.textContent = answer;
      button.addEventListener('click', () => chooseAnswer(answerIndex));
      answersEl.appendChild(button);
    });
  }

  patient.visible = index >= 1 && index <= 3;
  aed.visible = index >= 3;
  updateProgress();
}

function chooseAnswer(answerIndex) {
  if (answered) return;
  answered = true;

  const stage = stages[currentStage];
  const buttons = [...answersEl.querySelectorAll('button')];
  const isCorrect = answerIndex === stage.correct;

  buttons.forEach((button, index) => {
    button.disabled = true;
    if (index === stage.correct) button.classList.add('correct');
    else if (index === answerIndex) button.classList.add('wrong');
  });

  feedbackEl.textContent =
    (isCorrect ? 'Правильно. ' : 'Не зовсім. ') + stage.feedback;
  feedbackEl.style.display = 'block';
  nextButton.style.display = 'block';
}

nextButton.addEventListener('click', () => {
  if (currentStage === stages.length - 1) {
    showStage(0);
  } else {
    showStage(currentStage + 1);
  }
});

// Легка анімація персонажа
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();

  // Ледь помітне дихання тулуба
  body.scale.y = 1 + Math.sin(t * 2) * 0.004;

  // Невеликі природні рухи голови
  headGroup.rotation.y = Math.sin(t * 0.55) * 0.035;
  headGroup.rotation.x = Math.sin(t * 0.8) * 0.012;

  // Руки залишаються опущеними
  leftArm.rotation.z = Math.sin(t * 0.7) * 0.012;
  rightArm.rotation.z = -Math.sin(t * 0.7) * 0.012;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

showStage(0);
animate();
</script>
</body>
</html>
