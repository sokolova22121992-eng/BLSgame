
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLS Game — А ти вмієш?</title>

<style>
:root {
  --blue: #1677d2;
  --dark: #10283f;
  --light: #eaf4ff;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: var(--dark);
  background: #dceaf7;
}

#game {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background: linear-gradient(#b8d9f4, #edf5fc 72%, #a6bca9);
}

#world {
  position: absolute;
  inset: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#hud {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 18px;
  padding: 18px;
  pointer-events: none;
}

.topbar, .dialogue {
  pointer-events: auto;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.brand, .progress {
  border-radius: 12px;
  padding: 10px 13px;
  font-size: 12px;
  font-weight: bold;
}

.brand {
  color: white;
  background: #10283fdd;
  letter-spacing: 1px;
}

.progress {
  color: var(--dark);
  background: #ffffffed;
}

.dialogue {
  width: min(680px, 100%);
  margin: 0 auto;
  padding: 22px;
  border: 1px solid #ffffffb0;
  border-radius: 22px;
  background: #ffffffed;
  box-shadow: 0 12px 40px #18395525;
  backdrop-filter: blur(8px);
}

.eyebrow {
  color: var(--blue);
  text-transform: uppercase;
  letter-spacing: 1.3px;
  font-size: 11px;
  font-weight: 800;
}

h1 {
  font-size: clamp(25px, 5vw, 38px);
  line-height: 1.12;
  margin: 9px 0 12px;
}

#speech {
  font-size: 16px;
  line-height: 1.5;
  margin: 0 0 16px;
}

#choices {
  display: grid;
  gap: 9px;
}

.choice, .main-btn {
  width: 100%;
  font: inherit;
  cursor: pointer;
  border-radius: 13px;
  padding: 13px 15px;
  transition: background .15s, border-color .15s;
}

.choice {
  text-align: left;
  line-height: 1.4;
  color: var(--dark);
  background: white;
  border: 1px solid #c9d9e8;
}

.choice:hover:not(:disabled) {
  background: #edf6ff;
  border-color: var(--blue);
}

.choice:disabled {
  cursor: default;
}

.choice.correct {
  border: 2px solid #18834c;
  background: #e5f7ed;
}

.choice.wrong {
  border: 2px solid #c77a28;
  background: #fff3e3;
}

.main-btn {
  display: block;
  margin-top: 13px;
  text-align: center;
  font-weight: bold;
  color: white;
  background: var(--blue);
  border: 0;
}

.main-btn:hover {
  background: #0c61b1;
}

#feedback {
  display: none;
  margin-top: 13px;
  border-radius: 12px;
  padding: 13px;
  font-size: 14px;
  line-height: 1.5;
  background: #edf5fc;
}

#feedback.show {
  display: block;
}

#feedback.good {
  background: #e5f7ed;
  border-left: 4px solid #18834c;
}

#feedback.try-again {
  background: #fff3e3;
  border-left: 4px solid #c77a28;
}

#hint {
  color: #5a6f80;
  font-size: 11px;
  line-height: 1.4;
  margin-top: 11px;
}

@media (max-width: 600px) {
  #hud { padding: 11px; gap: 12px; }
  .dialogue { padding: 17px; border-radius: 18px; }
  #speech { font-size: 15px; }
  .choice, .main-btn { padding: 12px; }
  .brand, .progress { font-size: 11px; padding: 9px; }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
  }
}
</script>
</head>

<body>
<div id="game">
  <div id="world"></div>

  <div id="hud">
    <div class="topbar">
      <div class="brand">BLS GAME · ERC 2025</div>
      <div class="progress" id="progress">Вступ</div>
    </div>

    <section class="dialogue">
      <div class="eyebrow" id="eyebrow">Інтерактивний сценарій</div>
      <h1 id="title">А ти зможеш урятувати?</h1>
      <p id="speech">
        Не колись. Не в теорії. А тут і зараз, коли кожна секунда має значення.
      </p>

      <div id="choices"></div>
      <div id="feedback" role="status" aria-live="polite"></div>

      <button class="main-btn" id="next">Почати сценарій</button>

      <div id="hint">
        Навчальний сценарій для дорослих. Не замінює практичного навчання BLS.
      </div>
    </section>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin } from '@pixiv/three-vrm';

const world = document.querySelector('#world');
const title = document.querySelector('#title');
const speech = document.querySelector('#speech');
const eyebrow = document.querySelector('#eyebrow');
const choicesBox = document.querySelector('#choices');
const feedback = document.querySelector('#feedback');
const nextButton = document.querySelector('#next');
const progress = document.querySelector('#progress');

let stage = 0;
let answered = false;
let vrm = null;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#b8d9f4');
scene.fog = new THREE.Fog('#dceaf7', 14, 32);

const camera = new THREE.PerspectiveCamera(
  36, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.set(0, 2.8, 9.5);
camera.lookAt(0.4, 1.05, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
world.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x71869b, 2.2));

const sunlight = new THREE.DirectionalLight(0xffffff, 2.5);
sunlight.position.set(-4, 8, 6);
sunlight.castShadow = true;
scene.add(sunlight);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({
    color: '#9eb6a2',
    roughness: 1
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.03;
ground.receiveShadow = true;
scene.add(ground);

const worldProps = new THREE.Group();
const characterGroup = new THREE.Group();
scene.add(worldProps, characterGroup);

function material(color, roughness = 0.75) {
  return new THREE.MeshStandardMaterial({ color, roughness });
}

function addBox(parent, size, pos, color) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(...size),
    material(color)
  );
  mesh.position.set(...pos);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function makeAmbulance() {
  const van = new THREE.Group();
  van.position.set(2.35, 0, -0.8);
  van.rotation.y = -0.12;

  addBox(van, [2.9, 1.45, 1.3], [0, 1.05, 0], '#f8fafc');
  addBox(van, [1.1, 1.15, 1.27], [-0.82, 1.48, 0], '#f8fafc');
  addBox(van, [0.65, 0.46, 0.025], [-0.82, 1.65, 0.66], '#75b9e8');
  addBox(van, [2.91, 0.2, 1.32], [0, 0.88, 0], '#e33443');
  addBox(van, [0.8, 0.09, 1.35], [0, 1.53, 0], '#d9263c');
  addBox(van, [0.36, 0.22, 0.08], [0.35, 1.6, 0.68], '#f4f7fa');
  addBox(van, [0.55, 0.13, 0.18], [0, 1.86, 0], '#f34652');

  for (const x of [-0.9, 0.88]) {
    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.29, 0.29, 0.15, 24),
      material('#283744')
    );
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(x, 0.35, 0.66);
    van.add(wheel);

    const wheel2 = wheel.clone();
    wheel2.position.z = -0.66;
    van.add(wheel2);
  }

  worldProps.add(van);
}

function makeFallbackCharacter() {
  const body = new THREE.Group();

  const torso = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.38, 0.85, 20),
    material('#1765a6')
  );
  torso.position.y = 1.25;
  body.add(torso);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 24, 20),
    material('#e9bd9e')
  );
  head.position.y = 1.92;
  body.add(head);

  const hair = new THREE.Mesh(
    new THREE.SphereGeometry(
      0.26, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.62
    ),
    material('#49362f')
  );
  hair.position.set(0, 2.0, -0.015);
  body.add(hair);

  for (const x of [-0.15, 0.15]) {
    const leg = new THREE.Mesh(
      new THREE.CylinderGeometry(0.105, 0.12, 0.7, 12),
      material('#263e55')
    );
    leg.position.set(x, 0.47, 0);
    body.add(leg);
  }

  for (const x of [-0.39, 0.39]) {
    const arm = new THREE.Mesh(
      new THREE.CylinderGeometry(0.09, 0.105, 0.72, 12),
      material('#1765a6')
    );
    arm.position.set(x, 1.28, 0);
    arm.rotation.z = -x * 0.65;
    body.add(arm);
  }

  addBox(body, [0.16, 0.2, 0.035], [0, 1.33, 0.31], '#ffffff');
  body.position.set(-1.5, 0, 0.1);
  characterGroup.add(body);
}

function makeManikin() {
  const m = new THREE.Group();
  m.position.set(0.2, 0.08, 0.1);
  m.rotation.y = -0.2;

  const torso = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.32, 0.68, 4, 10),
    material('#e4c2a8')
  );
  torso.rotation.z = Math.PI / 2;
  torso.scale.set(1, 0.8, 0.75);
  torso.position.set(0, 0.4, 0);
  m.add(torso);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.23, 20, 16),
    material('#e4c2a8')
  );
  head.position.set(-0.72, 0.43, 0);
  m.add(head);

  const legs = new THREE.Mesh(
    new THREE.BoxGeometry(0.85, 0.18, 0.3),
    material('#263f55')
  );
  legs.position.set(0.82, 0.18, 0);
  m.add(legs);

  const arm = new THREE.Mesh(
    new THREE.BoxGeometry(0.72, 0.12, 0.17),
    material('#e4c2a8')
  );
  arm.position.set(-0.03, 0.34, 0.3);
  m.add(arm);

  worldProps.add(m);
}

function makeAED() {
  const device = new THREE.Group();
  device.position.set(1.0, 0, 0.1);

  addBox(device, [0.48, 0.62, 0.2], [0, 0.55, 0], '#f8fafc');
  addBox(device, [0.29, 0.12, 0.025], [0, 0.67, 0.112], '#a6e3be');
  addBox(device, [0.15, 0.14, 0.025], [0, 0.43, 0.112], '#e33443');
  addBox(device, [0.12, 0.025, 0.025], [0, 0.43, 0.13], '#ffffff');

  const handle = new THREE.Mesh(
    new THREE.TorusGeometry(0.13, 0.025, 8, 20, Math.PI),
    material('#dfe8ef')
  );
  handle.position.set(0, 0.88, 0);
  device.add(handle);

  worldProps.add(device);
}

function buildEnvironment() {
  worldProps.clear();
  makeAmbulance();

  if (stage >= 1 && stage <= 3) {
    makeManikin();
  }

  if (stage === 3) {
    makeAED();
  }

  if (stage === 0 || stage === 4) {
    camera.position.set(0, 2.8, 9.5);
    camera.lookAt(0.4, 1.05, 0);
  } else {
    camera.position.set(0, 3.2, 8.7);
    camera.lookAt(0.1, 0.85, 0);
  }
}

const stages = [
  {
    label: 'Вступ',
    eyebrow: '16 жовтня · День перезапуску серця',
    title: 'А ти зможеш урятувати?',
    speech: 'Поруч людина втрачає свідомість. Вона не дихає нормально. Кожна секунда має значення. Перевір, чи знаєш ти, що робити.',
    button: 'Почати сценарій'
  },
  {
    label: 'Крок 1 із 3',
    eyebrow: 'Безпека та реакція',
    title: 'Людина лежить нерухомо',
    speech: 'Ти переконався, що місце безпечне. Доросла людина лежить на землі й не реагує на звернення та дотик до плечей. Що робитимеш?',
    choices: [
      {
        text: 'А. Покличу на допомогу, викличу ЕМД на гучному зв’язку й оціню дихання',
        correct: true,
        explanation: 'Правильно. Якщо людина не реагує, поклич на допомогу, активуй виклик ЕМД і швидко оціни дихання. Виконуй інструкції диспетчера.'
      },
      {
        text: 'Б. Піду шукати ліки або воду',
        correct: false,
        explanation: 'Не залишай людину заради ліків чи води. Потрібно організувати виклик ЕМД і швидко оцінити дихання.'
      },
      {
        text: 'В. Зачекаю, можливо, вона сама отямиться',
        correct: false,
        explanation: 'Не чекай. Відсутність реакції потребує негайних дій: поклич на допомогу, виклич ЕМД і оціни дихання.'
      }
    ]
  },
  {
    label: 'Крок 2 із 3',
    eyebrow: 'Розпізнай зупинку серця',
    title: 'Людина хапає повітря',
    speech: 'Людина не реагує. Дихання відсутнє або є лише поодинокі судомні вдихи. Що робитимеш?',
    choices: [
      {
        text: 'А. Вважатиму це нормальним диханням і почекаю',
        correct: false,
        explanation: 'Поодинокі судомні вдихи або хапання повітря — ненормальне дихання. У людини, яка не реагує, це може бути ознакою зупинки серця.'
      },
      {
        text: 'Б. Припущу зупинку серця й негайно почну СЛР',
        correct: true,
        explanation: 'Правильно. Якщо людина не реагує й не дихає нормально, підозрюй зупинку серця та негайно починай СЛР. Не затримуй її початок тривалим пошуком пульсу.'
      },
      {
        text: 'В. Довго шукатиму пульс, перш ніж щось робити',
        correct: false,
        explanation: 'Не затримуй СЛР тривалим пошуком пульсу. Для непрофесійного рятувальника ключові ознаки — відсутність реакції та ненормальне дихання.'
      }
    ]
  },
  {
    label: 'Крок 3 із 3',
    eyebrow: 'Компресії та АЗД',
    title: 'Починай СЛР',
    speech: 'Яка дія відповідає рекомендаціям для дорослого? Обери найкращий варіант.',
    choices: [
      {
        text: 'А. 60–80 компресій за хвилину, глибиною 3–4 см',
        correct: false,
        explanation: 'Частота й глибина недостатні. Дорослому потрібні компресії з частотою 100–120 за хвилину та глибиною 5–6 см.'
      },
      {
        text: 'Б. 100–120 за хвилину, глибиною 5–6 см; застосувати АЗД щойно він доступний',
        correct: true,
        explanation: 'Правильно. Натискай по центру грудної клітки, забезпечуй повне розправлення грудної клітки й мінімізуй перерви. Увімкни АЗД, наклей електроди та виконуй голосові команди. Після розряду або команди не розряджати негайно віднови СЛР.'
      },
      {
        text: 'В. Чекатиму на АЗД і не робитиму компресій',
        correct: false,
        explanation: 'Не чекай бездіяльно. Починай СЛР негайно й застосуй АЗД, щойно він стане доступним.'
      }
    ]
  },
  {
    label: 'Фініш',
    eyebrow: 'Твої дії мають значення',
    title: 'А ти вмієш?',
    speech: 'Зупинка серця — це ситуація, у якій важлива кожна секунда. Розпізнай її, виклич допомогу, почни СЛР і застосуй АЗД. Знання потрібно відпрацьовувати практично.',
    button: 'Пройти ще раз'
  }
];

function showStage() {
  const s = stages[stage];
  answered = false;

  title.textContent = s.title;
  speech.textContent = s.speech;
  eyebrow.textContent = s.eyebrow;
  progress.textContent = s.label;

  choicesBox.replaceChildren();
  feedback.className = '';
  feedback.textContent = '';

  nextButton.style.display = 'block';
  nextButton.textContent = s.button || 'Продовжити';

  if (s.choices) {
    nextButton.style.display = 'none';

    s.choices.forEach(option => {
      const button = document.createElement('button');
      button.className = 'choice';
      button.textContent = option.text;

      button.addEventListener('click', () => {
        if (answered) return;
        answered = true;

        [...choicesBox.children].forEach(b => {
          b.disabled = true;
        });

        button.classList.add(option.correct ? 'correct' : 'wrong');

        feedback.textContent =
          (option.correct ? '✓ Правильно! ' : 'Не зовсім. ') +
          option.explanation;

        feedback.className = option.correct
          ? 'show good'
          : 'show try-again';

        nextButton.style.display = 'block';
        nextButton.textContent =
          stage === 3 ? 'Завершити гру' : 'Наступна сцена';
      });

      choicesBox.appendChild(button);
    });
  }

  buildEnvironment();
}

nextButton.addEventListener('click', () => {
  if (stage === 4) {
    stage = 0;
  } else if (stage === 0 || answered) {
    stage++;
  } else {
    return;
  }

  showStage();
});

// Завантажуємо твою 3D-персонажку з avatar.vrm
const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));

loader.load(
  './avatar.vrm',
  gltf => {
    vrm = gltf.userData.vrm;
    if (!vrm) return;

    characterGroup.clear();

    vrm.scene.position.set(0, 0, 0);
    vrm.scene.rotation.y = Math.PI;
    vrm.scene.scale.setScalar(1);

    vrm.scene.traverse(obj => {
      obj.frustumCulled = false;
      if (obj.isMesh) obj.castShadow = true;
    });

    characterGroup.add(vrm.scene);
    characterGroup.position.set(-1.5, 0, 0.1);
  },
  undefined,
  error => {
    console.error('Не вдалося завантажити avatar.vrm:', error);
  }
);

// Тимчасова персонажка, поки завантажується VRM
makeFallbackCharacter();

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (vrm) vrm.update(delta);

  characterGroup.position.y =
    Math.sin(clock.elapsedTime * 1.5) * 0.018;

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

showStage();
</script>
</body>
</html>
