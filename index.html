<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eaf4ff">
<title>BLS — інтерактивний сценарій</title>

<style>
:root {
  --blue: #1769aa;
  --dark: #173653;
  --light: #eaf4ff;
  --green: #16834a;
  --red: #c53b43;
  --text: #18334b;
}

* { box-sizing: border-box; }

html { min-height: 100%; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background: linear-gradient(145deg, #edf5ff, #dce9f7);
  min-height: 100vh;
  min-height: 100dvh;
}

button { font: inherit; }

.app {
  width: min(100%, 1440px);
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  padding: 12px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}

.brandBlock {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.header-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  border: 2px solid #60a5fa;
  box-shadow: 0 3px 10px #1769aa24;
}

.brand {
  font-size: clamp(18px, 2vw, 25px);
  font-weight: 800;
  letter-spacing: .3px;
}

.subtitle {
  color: #55718b;
  font-size: 12px;
  margin-top: 3px;
}

.counter {
  white-space: nowrap;
  border: 1px solid #c2d7ec;
  background: #fff;
  border-radius: 30px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 700;
}

.progress {
  height: 5px;
  flex-shrink: 0;
  background: #cfdeed;
  border-radius: 8px;
  overflow: hidden;
}

.progressFill {
  height: 100%;
  width: 16.66%;
  background: linear-gradient(90deg, #2c8bd3, #14528e);
  transition: width .3s;
}

/* ОСНОВНЕ РОЗТАШУВАННЯ */
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr);
  gap: 12px;
  flex: 1;
  min-height: 0;
  align-items: stretch;
}

.sceneCard,
.panel {
  min-width: 0;
  min-height: 0;
  background: #fff;
  border: 1px solid #d1e0ef;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 28px #234b7010;
}

/* СЦЕНА */
.sceneCard {
  display: flex;
  flex-direction: column;
}

.sceneTop {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px 13px;
  background: #f7fbff;
  border-bottom: 1px solid #e1eaf3;
  flex-shrink: 0;
}

.sceneLabel {
  font-weight: 800;
  font-size: 12px;
  letter-spacing: .6px;
}

.sceneStatus {
  color: #57728b;
  font-size: 11px;
  text-align: right;
}

.sceneWrap {
  width: 100%;
  flex: 1;
  min-height: 0;
  background: #e5edf1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#scene {
  display: block;
  width: 100%;
  height: auto;
  max-height: 100%;
  aspect-ratio: 900 / 350;
}

.sceneCaption {
  background: #f7fbff;
  padding: 9px 12px;
  font-size: 12px;
  line-height: 1.4;
  color: #526b82;
  border-top: 1px solid #e2ebf4;
  flex-shrink: 0;
}

/* ПАНЕЛЬ ЗАПИТАНЬ */
.panel {
  padding: clamp(13px, 1.5vw, 22px);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.eyebrow {
  font-size: 10px;
  font-weight: 800;
  color: var(--blue);
  letter-spacing: 1px;
  margin-bottom: 7px;
  flex-shrink: 0;
}

h1 {
  font-size: clamp(18px, 1.8vw, 25px);
  line-height: 1.23;
  margin: 0 0 7px;
  flex-shrink: 0;
}

.questionHint {
  color: #647b90;
  font-size: 12px;
  line-height: 1.4;
  margin-bottom: 12px;
  flex-shrink: 0;
}

.answers {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.answer {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  text-align: left;
  padding: 10px;
  border: 1.5px solid #d7e3ef;
  border-radius: 10px;
  background: #fff;
  color: var(--text);
  font-size: 12px;
  line-height: 1.35;
  cursor: pointer;
  min-height: 52px;
  transition: border-color .15s, background .15s, transform .15s;
}

.answer:hover {
  border-color: #6da8db;
  background: #f5faff;
}

.answer:active { transform: scale(.99); }

.answer:focus-visible,
.primary:focus-visible,
.secondary:focus-visible {
  outline: 3px solid #79b7ed;
  outline-offset: 2px;
}

.letter {
  flex: 0 0 23px;
  height: 23px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  background: #eaf3fc;
  color: #215e94;
  font-weight: 800;
  font-size: 12px;
}

.answer.correct {
  border-color: #299b62;
  background: #eefaf3;
}

.answer.correct .letter {
  background: #d0f0dd;
  color: #12693a;
}

.answer.wrong {
  border-color: #d85c62;
  background: #fff2f2;
}

.answer.wrong .letter {
  background: #fbe0e0;
  color: #a5252b;
}

.answer:disabled { cursor: default; }

.feedback {
  display: none;
  margin-top: 10px;
  padding: 11px;
  border-radius: 10px;
  line-height: 1.45;
  font-size: 12px;
  flex-shrink: 0;
}

.feedback.show { display: block; }

.feedback.good {
  background: #edf9f1;
  border: 1px solid #c4e9d0;
}

.feedback.bad {
  background: #fff4ed;
  border: 1px solid #f0d3be;
}

.feedback strong {
  display: block;
  margin-bottom: 3px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
  flex-shrink: 0;
}

.primary,
.secondary {
  border: 0;
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}

.primary {
  background: var(--blue);
  color: #fff;
}

.primary:hover { background: #10588f; }

.secondary {
  background: #edf3f9;
  color: #36536e;
}

.hidden { display: none !important; }

/* ДИСКЛЕЙМЕР */
.learningNote {
  flex-shrink: 0;
  background: #e9f1f9;
  border: 1px solid #cfdeec;
  border-radius: 11px;
  padding: 9px 13px;
  font-size: 11px;
  line-height: 1.4;
  color: #405d77;
}

.learningNote strong {
  display: block;
  color: #173e62;
  font-size: 12px;
  margin-bottom: 2px;
}

/* ПІДПИС РОЗРОБНИКА */
footer {
  flex-shrink: 0;
  display: flex;
  justify-content: flex-end;
  color: #72869a;
  font-size: 10px;
  padding: 0 2px 1px;
}

/* НИЗЬКІ ЕКРАНИ НОУТБУКІВ */
@media (min-width: 850px) and (max-height: 800px) {
  .app {
    padding: 8px 12px 5px;
    gap: 6px;
  }

  .workspace { gap: 9px; }

  .sceneTop { padding: 7px 11px; }

  .sceneCaption {
    padding: 6px 10px;
    font-size: 11px;
  }

  .panel { padding: 12px; }

  h1 { font-size: 19px; }

  .questionHint { margin-bottom: 8px; }

  .answer {
    min-height: 44px;
    padding: 8px;
    font-size: 11px;
  }

  .learningNote { padding: 7px 10px; }
}

/* ТЕЛЕФОНИ ТА ВУЗЬКІ ЕКРАНИ */
@media (max-width: 849px) {
  .app {
    padding: 8px;
    gap: 7px;
  }

  .workspace {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .sceneCard { flex: 0 0 auto; }

  .sceneWrap { flex: 0 0 auto; }

  #scene {
    width: 100%;
    height: auto;
    max-height: none;
  }

  .sceneTop { padding: 7px 10px; }

  .sceneCaption {
    padding: 7px 10px;
    font-size: 11px;
  }

  .panel {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
  }

  .eyebrow { margin-bottom: 5px; }

  h1 {
    font-size: clamp(17px, 4.5vw, 22px);
    margin-bottom: 6px;
  }

  .questionHint {
    font-size: 11px;
    margin-bottom: 8px;
  }

  .answers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
  }

  .answer {
    padding: 8px;
    gap: 6px;
    min-height: 0;
    font-size: 11px;
    line-height: 1.3;
  }

  .letter {
    flex-basis: 21px;
    height: 21px;
    font-size: 11px;
  }

  .feedback {
    margin-top: 8px;
    padding: 9px;
    font-size: 11px;
  }

  .actions { margin-top: 8px; }

  .primary,
  .secondary {
    padding: 10px;
    font-size: 12px;
  }

  .learningNote {
    padding: 8px 10px;
    font-size: 10px;
    line-height: 1.35;
  }

  .learningNote strong { font-size: 11px; }

  footer { font-size: 9px; }
}

/* ДУЖЕ ВУЗЬКІ ТЕЛЕФОНИ */
@media (max-width: 380px) {
  .app {
    padding: 6px;
    gap: 6px;
  }

  .brand { font-size: 17px; }

  .subtitle {
    max-width: 200px;
    font-size: 10px;
  }

  .counter {
    padding: 7px 8px;
    font-size: 10px;
  }

  .sceneStatus { font-size: 10px; }

  .panel { padding: 9px; }

  .answer {
    font-size: 10px;
    padding: 7px;
  }

  .brandBlock { gap: 8px; }

  .header-avatar {
    width: 38px;
    height: 38px;
  }
}

/* ЗМЕНШЕНА ВИСОТА МОБІЛЬНОГО ЕКРАНА */
@media (max-width: 849px) and (max-height: 760px) {
  .app {
    gap: 5px;
    padding: 5px;
  }

  .workspace { gap: 5px; }

  .sceneTop { padding: 5px 8px; }

  .sceneCaption {
    padding: 5px 8px;
    font-size: 10px;
  }

  .panel { padding: 8px; }

  h1 { font-size: 16px; }

  .questionHint { margin-bottom: 6px; }

  .answer {
    padding: 6px;
    font-size: 10px;
  }

  .learningNote {
    padding: 6px 8px;
    font-size: 9px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brandBlock">
    <img src="./bls-avatar.png" alt="" class="header-avatar">
    <div>
      <div class="brand">BLS <span style="color:#2477b9">INTERACTIVE</span></div>
      <div class="subtitle">Базова підтримка життя · Навчальний сценарій</div>
    </div>
  </div>
  <div class="counter" id="counter">Етап 1 із 6</div>
</header>

<div class="progress" aria-label="Прогрес сценарію">
  <div class="progressFill" id="progress"></div>
</div>

<div class="workspace">

<section class="sceneCard">
  <div class="sceneTop">
    <div class="sceneLabel">СИТУАЦІЯ</div>
    <div class="sceneStatus" id="sceneStatus">Виявлення постраждалого</div>
  </div>

  <div class="sceneWrap">
    <svg id="scene" viewBox="0 0 900 350" role="img"
      aria-label="Перехожий біля дорослого постраждалого, який лежить на спині">

      <defs>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e5edf0"/>
          <stop offset="100%"
